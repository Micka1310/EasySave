# Démo locale (projet scolaire) : Docker sur TON PC simule le serveur d'entreprise.
#   docker compose down
#   docker compose up -d --build
# EasySave → URL http://localhost:5088
# Logs visibles dans ./central-logs/ (équivalent du disque du serveur en prod)
#
# En VRAI serveur : même image Docker, volume sur /var/easysave/logs (pas le dossier du projet),
# les PC clients envoient vers http://nom-du-serveur:5088

services:
  easysave-logcentral:
    build:
      context: .
      dockerfile: LogCentral/Dockerfile
    ports:
      - "5088:8080"
    volumes:
      - ./central-logs:/app/logs
    environment:
      LOG_DATA_DIR: /app/logs
